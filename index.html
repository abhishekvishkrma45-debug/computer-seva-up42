<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Mini GTA Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #fff; text-align: center; font-family: sans-serif; overflow: hidden; }
    #instructions { padding: 10px; background: #222; font-size: 14px; }
    canvas { background: #333; display: block; margin: 10px auto; border: 2px solid #555; }
  </style>
</head>
<body>

  <div id="instructions">
    🎮 <b>Controls:</b> Arrow Keys / WASD = Move | <b>F</b> = Enter/Exit Car
  </div>
  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Player
    const player = {
      x: 100,
      y: 100,
      size: 15,
      color: '#38bdf8',
      speed: 3,
      inCar: false
    };

    // Car
    const car = {
      x: 300,
      y: 200,
      width: 40,
      height: 25,
      color: '#ef4444',
      speed: 5
    };

    // Buildings (Obstacles/City Layout)
    const buildings = [
      { x: 200, y: 50, w: 100, h: 100 },
      { x: 500, y: 100, w: 150, h: 200 },
      { x: 100, y: 300, w: 250, h: 120 }
    ];

    const keys = {};

    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'f') toggleCar();
    });

    window.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
    });

    function toggleCar() {
      if (!player.inCar) {
        // Check distance to car
        let dist = Math.hypot(player.x - (car.x + car.width/2), player.y - (car.y + car.height/2));
        if (dist < 50) {
          player.inCar = true;
        }
      } else {
        // Exit car
        player.inCar = false;
        player.x = car.x - 20;
        player.y = car.y;
      }
    }

    function update() {
      let currentSpeed = player.inCar ? car.speed : player.speed;

      if (keys['arrowup'] || keys['w']) {
        if (player.inCar) car.y -= currentSpeed; else player.y -= currentSpeed;
      }
      if (keys['arrowdown'] || keys['s']) {
        if (player.inCar) car.y += currentSpeed; else player.y += currentSpeed;
      }
      if (keys['arrowleft'] || keys['a']) {
        if (player.inCar) car.x -= currentSpeed; else player.x -= currentSpeed;
      }
      if (keys['arrowright'] || keys['d']) {
        if (player.inCar) car.x += currentSpeed; else player.x += currentSpeed;
      }

      // If player is inside car, sync positions
      if (player.inCar) {
        player.x = car.x + car.width / 2;
        player.y = car.y + car.height / 2;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Roads Grid
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 40;
      ctx.beginPath();
      ctx.moveTo(0, 212); ctx.lineTo(800, 212);
      ctx.moveTo(400, 0); ctx.lineTo(400, 500);
      ctx.stroke();

      // Draw Buildings
      ctx.fillStyle = '#1e293b';
      buildings.forEach(b => {
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
      });

      // Draw Car
      ctx.fillStyle = car.color;
      ctx.fillRect(car.x, car.y, car.width, car.height);

      // Draw Player (Only if not inside car)
      if (!player.inCar) {
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
